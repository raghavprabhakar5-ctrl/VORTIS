    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0A0A0F; }
      #root { width: 100%; height: 100%; overflow: hidden; background: #0A0A0F; }
      body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

      /* ── Splash screen ── */
      #splash {
        position: fixed; inset: 0;
        background: #0A0A0F;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999; gap: 18px;
        transition: opacity .5s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash-logo {
        width: 56px; height: 56px;
        animation: splashPulse 1.6s ease-in-out infinite;
      }
      #splash-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px; font-weight: 700;
        letter-spacing: .18em;
        color: rgba(255,255,255,.25);
      }
      #splash-dots {
        display: flex; gap: 6px; align-items: center;
      }
      #splash-dots span {
        width: 5px; height: 5px; border-radius: 50%;
        background: #8b5cf6; opacity: .3;
        animation: splashDot 1.2s ease-in-out infinite;
      }
      #splash-dots span:nth-child(2) { animation-delay: .2s; }
      #splash-dots span:nth-child(3) { animation-delay: .4s; }
      @keyframes splashPulse {
        0%,100% { opacity: .4; transform: scale(.92); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @keyframes splashDot {
        0%,100% { opacity: .2; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-4px); }
      }
    </style>

    <script>
      // Hide splash once React mounts
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          const splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(() => { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 600);
          }
          observer.disconnect();
        }
      });
      const rootEl = document.getElementById('root');
      if (rootEl) observer.observe(rootEl, { childList: true });
    </script>
